name: Check Pull Request

on:
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  pr-prep:
    name: Preparation
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - name: Prepare PR
        uses: DEFRA/epr-re-ex-service/.github/actions/pr-preparation@main

      - name: Check for docs-only changes
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const docsOnly = files.length > 0 && files.every(file => file.filename.endsWith('.md'));

            core.setOutput('docs-only', docsOnly);
            console.log(`Documentation-only changes: ${docsOnly}`);
            console.log(`Changed files: ${files.map(f => f.filename).join(', ')}`)

  test-and-scan:
    name: Test and Scan
    runs-on: ubuntu-latest
    needs: pr-prep
    if: needs.pr-prep.outputs.docs-only != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Pull test container images in the background
        run: nohup docker compose -f .vite/fixtures/compose.yml pull --quiet > /dev/null 2>&1 &

      - name: Cache MongoDB binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('.vite/fixtures/compose.yml') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Test and Scan
        uses: DEFRA/epr-re-ex-service/.github/actions/test-and-scan@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  type-check-prod:
    name: Lint Types - Prod
    runs-on: ubuntu-latest
    needs: pr-prep
    if: needs.pr-prep.outputs.docs-only != 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: DEFRA/epr-re-ex-service/.github/actions/lint-types@main
        with:
          npm-script: lint:types
          tsconfig: jsconfig.typecheck.json
          label: Prod
          comment-header: lint-types-prod
          fail-on: all

  type-check-tests:
    name: Lint Types - Tests
    runs-on: ubuntu-latest
    needs: pr-prep
    if: needs.pr-prep.outputs.docs-only != 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: DEFRA/epr-re-ex-service/.github/actions/lint-types@main
        with:
          fail-on: all

  # The one context the branch ruleset requires from this workflow, so every
  # blocking job must appear in `needs` below. Left out on purpose: test-journey,
  # because `Run Journey Tests` is required separately, and journey-summary,
  # typecheck-burndown and database-id-count, because they are advisory.
  pr-checks:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - pr-prep
      - test-and-scan
      - type-check-prod
      - type-check-tests
      - dependency-review
    if: always()
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED: 5
        run: |
          echo "$RESULTS"
          COUNT=$(echo "$RESULTS" | jq -r 'length')
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "Expected $EXPECTED jobs in needs, found $COUNT: update EXPECTED when you add a job"
            exit 1
          fi
          NOT_PASSED=$(echo "$RESULTS" | jq -r 'to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | .[] | "\(.key)=\(.value.result)"')
          if [ -n "$NOT_PASSED" ]; then
            echo "Did not pass: $(echo "$NOT_PASSED" | tr '\n' ' ')"
            exit 1
          fi
          echo "Every pull request check passed"

  typecheck-burndown:
    name: Typecheck strictness burndown
    runs-on: ubuntu-latest
    needs: pr-prep
    if: needs.pr-prep.outputs.docs-only != 'true'
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: DEFRA/epr-re-ex-service/.github/actions/typecheck-burndown@main

  database-id-count:
    name: Database ids outside the MongoDB adapters
    runs-on: ubuntu-latest
    needs: pr-prep
    if: needs.pr-prep.outputs.docs-only != 'true'
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Count database ids
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/database-id-count.mjs . base "$BASE_REF" | tee "$RUNNER_TEMP/database-id-count.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: database-id-count
          path: ${{ runner.temp }}/database-id-count.md

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: pr-prep
    if: needs.pr-prep.outputs.docs-only != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  test-journey:
    name: Run Journey Tests (${{ matrix.leg }})
    runs-on: ubuntu-latest
    needs: pr-prep
    if: needs.pr-prep.outputs.docs-only != 'true'
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: e2e-1, test-suite: e2e, shard: 1/3 }
          - { leg: e2e-2, test-suite: e2e, shard: 2/3 }
          - { leg: e2e-3, test-suite: e2e, shard: 3/3 }
          - { leg: december, test-suite: e2e, december-scope: only }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for matching journey test branch
        id: journey-branch
        run: |
          BRANCH="${{ github.head_ref }}"
          if git ls-remote --heads https://github.com/DEFRA/epr-re-ex-journey-tests.git "$BRANCH" | grep -q .; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Record build start time
        id: build-timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - run: docker build -t defradigital/epr-backend:${{github.sha}} .

      - name: Record test start time
        id: test-timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run journey tests on ${{ steps.journey-branch.outputs.ref }}
        uses: DEFRA/epr-re-ex-journey-tests/run-journey-tests@main
        with:
          epr-backend: ${{github.sha}}
          branch: ${{ steps.journey-branch.outputs.ref }}
          artifact-suffix: -${{ matrix.leg }}
          december-scope: ${{ matrix.december-scope || 'exclude' }}
          test-scope: all
          test-suite: ${{ matrix.test-suite }}
          shard: ${{ matrix.shard }}

      - name: Write journey test summary
        if: always()
        uses: DEFRA/epr-re-ex-service/.github/actions/journey-test-summary@main
        with:
          build-start: ${{ steps.build-timer.outputs.start }}
          test-start: ${{ steps.test-timer.outputs.start }}
          pr-comment: 'false'

  journey-summary:
    name: Journey Test Summary
    runs-on: ubuntu-latest
    needs: test-journey
    if: ${{ !cancelled() && needs.test-journey.result != 'skipped' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Write journey test summary
        uses: DEFRA/epr-re-ex-service/.github/actions/journey-test-summary@main
        with:
          outcome: ${{ needs.test-journey.result }}

  journey-tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    needs: test-journey
    if: always()
    steps:
      - name: Check journey test results
        run: |
          RESULT="${{ needs.test-journey.result }}"
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            echo "Journey tests reported '$RESULT'"
            exit 1
          fi
          echo "Journey tests reported '$RESULT'"
